name: Release

# Manuale con un numero di versione in input (es. "0.1.0", senza "v"): a
# differenza di build-linux.yml/build-windows.yml (solo artefatti Actions,
# scaricabili per 90 giorni e solo da chi ha un login GitHub) questo
# workflow builda entrambe le piattaforme e pubblica una vera GitHub
# Release — storico permanente, link "latest" stabile, scaricabile da
# chiunque senza account. Non serve creare/pushare un tag a mano: `gh
# release create` lo crea da sé puntando al branch di default, e la
# versione viene scritta in tauri.conf.json solo nel workspace di build
# (mai committata) così non disallinea il repo pubblico da quello privato
# da cui viene sincronizzato.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Numero di versione (es. 0.1.0, senza 'v')"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Installa le dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installa le dipendenze npm
        run: npm ci

      - name: Scarica il binario rclone incluso nell'app
        run: ./scripts/fetch-rclone-sidecar.sh

      - name: Scrive la versione della release in tauri.conf.json
        run: jq --arg v "${{ inputs.version }}" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json && mv /tmp/tauri.conf.json src-tauri/tauri.conf.json

      - name: Build
        run: npm run tauri build

      - name: Carica gli installer Linux
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installa le dipendenze npm
        run: npm ci

      - name: Scarica il binario rclone incluso nell'app
        run: ./scripts/fetch-rclone-sidecar.ps1

      - name: Scrive la versione della release in tauri.conf.json
        shell: bash
        run: jq --arg v "${{ inputs.version }}" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json && mv /tmp/tauri.conf.json src-tauri/tauri.conf.json

      - name: Build
        run: npm run tauri build -- --bundles nsis

      - name: Carica l'installer Windows
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Pubblica la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "dist/*" da solo prende anche le sottocartelle deb/rpm/appimage
          # (l'artefatto Linux mantiene la struttura relativa ai tre percorsi
          # dati a upload-artifact, che condividono un antenato comune) — gh
          # release create tenta di caricarle come fossero file e fallisce.
          # find isola i file veri, a qualunque profondità si trovino.
          mapfile -t FILES < <(find dist -type f)
          gh release create "v${{ inputs.version }}" "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --title "Rclone Easy v${{ inputs.version }}" \
            --generate-notes
