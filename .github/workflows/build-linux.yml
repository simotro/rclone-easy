name: Build Linux

# Manuale (bottone "Run workflow" nella scheda Actions): il progetto è
# ancora sperimentale e cambia spesso, buildare ad ogni push sprecherebbe
# minuti CI per build che nessuno scarica. Da valutare in futuro un
# trigger su tag (release vere e proprie).
"on":
  workflow_dispatch: {}

jobs:
  build:
    # Ubuntu 22.04 e non "ubuntu-latest" apposta: le AppImage vanno
    # costruite sulla base più vecchia ragionevole per essere compatibili
    # con più sistemi possibile. Risolve anche un problema reale riscontrato
    # buildando in locale su un rolling release (CachyOS): le librerie di
    # sistema lì sono compilate con un toolchain troppo recente (sezione
    # ELF .relr.dyn) che lo strip incluso in linuxdeploy (2024) non
    # riconosce, facendo fallire il bundling AppImage.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Installa le dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installa le dipendenze npm
        run: npm ci

      - name: Scarica il binario rclone incluso nell'app
        run: ./scripts/fetch-rclone-sidecar.sh

      - name: Build
        run: npm run tauri build

      # Tre artefatti separati e non uno solo con tutto dentro: chi scarica
      # per testare (es. su Arch/CachyOS, dove .deb/.rpm non si installano)
      # gli serve solo l'AppImage — un unico archivio con .deb+.rpm+AppImage
      # pesava ~180MB invece di ~100MB, inutilmente lento da scaricare.
      - name: Carica il pacchetto .deb
        uses: actions/upload-artifact@v7
        with:
          name: rclone-easy-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Carica il pacchetto .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rclone-easy-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Carica l'AppImage
        uses: actions/upload-artifact@v7
        with:
          name: rclone-easy-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
